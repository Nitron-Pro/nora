[package]
name = "nora"
version = "1.10.0"
description = "Modular offline-first desktop boilerplate with Tauri 2.0"
authors = ["Nora Team"]
edition = "2021"

[lib]
name = "nora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.5", features = [] }

[dependencies]
tauri = { version = "2.1.1", features = ["tray-icon"] }
tauri-plugin-shell = "2.0.1"
tauri-plugin-notification = "2.0.1"
tauri-plugin-autostart = "2.0.1"
# tauri-plugin-updater is used when Tauri binary signing keys (pubkey) are provisioned
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serialport = "4.6.0"
rusqlite = { version = "0.32.1", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
zeroize = "1.9.2"
git2 = { version = "0.21.0", default-features = false }
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
rand = "0.8"
sha2 = "0.11.1"
hex = "0.4.3"
base64 = "0.23.1"
zip = { version = "9.7.2", default-features = false, features = ["deflate"] }
globset = "0.4.21"
walkdir = "2.5.0"
russh = { version = "0.65.2", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3.0.1"
suppaftp = { version = "13.0.0", default-features = false, features = ["tokio-rustls-ring"] }
async-trait = "0.1.92"
encoding_rs = "0.8.44"
uuid = { version = "1.29.3", features = ["v4"] }
futures-util = "0.3.34"
tokio-util = "0.7.20"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0.12"
rustls-pki-types = "1.16.0"
tauri-plugin-dialog = "2.8.4"
